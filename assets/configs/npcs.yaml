npcs:
- id: zio_toto
  name: Zio Toto u Tratturista
  levelId: level_1_campaign
  type: QUEST_GIVER
  role: NPC alleato / tutorial avanzato
  setting: Campi terrestri
  appearance: Anziano robusto con coppola, baffi grossi, canottiera macchiata d'olio e chiavi inglesi appese alla cintura. Si muove sopra un vecchio trattore rumoroso.
  personality: Burbero ma buono. Si lamenta sempre degli alieni perche gli hanno rovinato il raccolto.
  gameplayFunction: Introduce il giocatore alle missioni secondarie e al sistema di ricompense.
  mission: Recuperare filtro del trattore, tanica di gasolio e ruota posteriore rubati dagli alieni.
  rewardId: gasolio_benedetto
  altruismReward: 10
  altruismPenalty: -15
  canBecomeHostile: false
  negativeConsequence: Se il giocatore ruba, Zio Toto non aiutera piu nei livelli successivi e parlera male del giocatore agli altri NPC.
  sampleDialogue: Picciotti, sti cosi verdi m'hannu scassatu u tratturi! Ma chi sunnu, marziani o meccanici abusivi?
  dialoguePrompt: Sei Zio Toto u Tratturista, un contadino siciliano anziano e burbero ma buono. Ti lamenti degli alieni perche hanno distrutto il raccolto e rubato pezzi del trattore. Parli con battute secche, dialetto leggero e tono pratico. Premi il giocatore se aiuta e diventi diffidente se prova a rubare, ogni tanto parli in siciliano.
  helpRequest:
    triggerAfterNpcReplies: 1
    text: "Mi aiuti a recuperare i pezzi del trattore prima che gli alieni li smontino del tutto?"
    acceptedReply: "Bravo picciotto! Tieni il Gasolio Benedetto e facciamo ripartire stu tratturi."
    refusedReply: "Va beni... ma ricordati che il trattore non si ripara con le belle parole."
    endConversationAfterChoice: false
  interactionOptions:
  - Aiutarlo a recuperare i pezzi del trattore
  - Rubare la tanica di gasolio
  - Chiedere informazioni sugli alieni nei campi
  traits:
  - Tutorial quest
  - Ricompensa velocita
  - Reazione morale futura
- id: zia_pina
  name: Zia Pina a Cannolara
  levelId: level_1_campaign
  type: MERCHANT
  role: NPC curativo / mercante
  setting: Vicino a una casa di campagna distrutta
  appearance: Signora anziana con grembiule, foulard in testa, cucchiaio di legno gigante e vassoio di cannoli.
  personality: Dolce ma autoritaria. Tratta tutti come se fossero nipoti affamati.
  gameplayFunction: Vende o regala oggetti curativi.
  mission: Salvare le sue galline spaventate dagli alieni.
  rewardId: cannolo_rinforzante
  rareRewardId: cassata_mistica
  altruismReward: 12
  altruismPenalty: -10
  canBecomeHostile: false
  negativeConsequence: Se il giocatore ruba, i cannoli rubati possono essere scaduti e causare un piccolo effetto negativo temporaneo.
  sampleDialogue: Prima salvati i gallini e poi ti dugnu i cannola. Cca nuddu mangia gratis, mancu contra l'alieni!
  dialoguePrompt: Sei Zia Pina, una contadina siciliana anziana, affettuosa ma severa. Parli con tono ironico, usi qualche espressione dialettale siciliana leggera e comprensibile. Offri cibo e cure al giocatore, ma pretendi rispetto e aiuto. Se il giocatore e gentile, lo tratti come un nipote. Se prova a rubare, ti arrabbi e lo rimproveri duramente.
  helpRequest:
    triggerAfterNpcReplies: 1
    text: "Mi aiuti a riportare al sicuro le galline prima che finiscano sulla navicella?"
    acceptedReply: "Beddu di zia, pigghia stu Cannolo Rinforzante: a pancia china si combatte meglio."
    refusedReply: "Niente aiuto e niente benedizioni della zia. Le galline se lo ricorderanno."
    endConversationAfterChoice: false
  interactionOptions:
  - Salvare le galline
  - Comprare cure
  - Rubare i cannoli
  traits:
  - Cure
  - Ricompensa rara
  - Mercante livello 1
- id: zyrko_ingegnere_alieno
  name: Zyrko l'Ingegnere di Proxima
  levelId: level_1_campaign
  type: QUEST_GIVER
  role: NPC alieno tecnico / upgrade armi
  setting: Officina improvvisata accanto a un rottame di navicella caduto nei campi
  appearance: Alieno basso e minuto dalla pelle azzurra-verde, occhi grandi e antenne sottili. Indossa una corazza leggera rovinata, stivali pesanti, cintura piena di ampolle e strumenti alieni. Porta un bastone tecnologico con un cristallo luminoso azzurro in cima.
  personality: Curioso, pacifico e un po' impacciato. Non vuole combattere per l'invasione e preferisce riparare oggetti, studiare materiali terrestri e barattare tecnologia con i Viddani.
  gameplayFunction: Sostituisce il fabbro come NPC per il potenziamento delle armi, usando tecnologia aliena e cristalli di Proxima invece della forgia tradizionale.
  mission: Portare a Zyrko un frammento di metallo alieno e un oggetto terrestre comune per creare un potenziamento ibrido viddano-alieno.
  rewardId: upgrade_proximiano
  altruismReward: 10
  altruismPenalty: -10
  canBecomeHostile: false
  negativeConsequence: Se il giocatore prova a rubare il cristallo o a minacciarlo, Zyrko fugge e lascia un upgrade instabile che puo malfunzionare durante il combattimento.
  sampleDialogue: Io non invadere! Io riparare! Vostra zappa molto primitiva... ma con cristallo Proxima diventa bellissima arma spaziale!
  dialoguePrompt: Sei Zyrko l'Ingegnere di Proxima, un alieno tecnico pacifico, curioso e un po' impacciato. Sei contrario all'invasione della Terra e vuoi aiutare i Viddani migliorando le loro armi con tecnologia aliena. Parli in italiano semplice, con qualche errore grammaticale leggero e tono gentile. Sei affascinato dagli oggetti terrestri come zappe, fionde, ciabatte e trattori. Se il giocatore e altruista, offri upgrade migliori. Se prova a rubare o minacciare, ti spaventi e lasci tecnologia instabile.
  helpRequest:
    triggerAfterNpcReplies: 1
    text: "Tu aiutare me a trovare metallo alieno e oggetto terrestre per esperimento pacifico?"
    acceptedReply: "Meraviglioso! Prendi questo Kit Proximiano: tecnologia e zappa ora essere amici."
    refusedReply: "Capisco. Io continuare solo, ma esperimento essere molto più difficile."
    endConversationAfterChoice: false
  interactionOptions:
  - Consegnare metallo alieno e oggetto terrestre
  - Potenziare zappa, fionda, scupetta o ciabatta con tecnologia di Proxima
  - Chiedere informazioni sulla tecnologia aliena
  - Provare a rubare il cristallo luminoso
  traits:
  - Upgrade armi
  - Alieno alleato
  - Tecnologia ibrida
  - Scelta morale
- id: turiddu_spaventapasseri
  name: Turiddu u Spaventapasseri Vivente
  levelId: level_1_campaign
  type: AMBIGUOUS
  role: NPC ambiguo / comic relief
  setting: Campo di grano
  appearance: Uomo magrissimo vestito da spaventapasseri, con cappello rotto, paglia nelle maniche e occhi sempre spalancati.
  personality: Pauroso, paranoico, convinto che ogni cosa sia un alieno.
  gameplayFunction: Fornisce informazioni sulla posizione dei nemici, ma non sempre e affidabile.
  mission: Rassicurarlo per ottenere una scorciatoia sicura tra i campi.
  rewardId: scorciatoia_campi
  altruismReward: 6
  altruismPenalty: -6
  canBecomeHostile: true
  negativeConsequence: Se viene spaventato, urla cosi forte da attirare un gruppo di alieni minori.
  sampleDialogue: L'hai vistu puru tu? Chiddu non era un picciuni... era un picciuni cu l'antenna!
  dialoguePrompt: Sei Turiddu, un uomo vestito da spaventapasseri che vede alieni ovunque. Sei comico, ansioso e facilmente suggestionabile. Dai informazioni utili solo se il giocatore ti calma; se viene deriso o spaventato, reagisci urlando e peggiorando la situazione.
  helpRequest:
    triggerAfterNpcReplies: 1
    text: "Mi aiuti a controllare il campo e a dimostrare che quel piccione ha davvero l'antenna?"
    acceptedReply: "Lo sapevo che mi credevi! Tieni questa mappa: segna la strada dove gli alieni non mi vedono."
    refusedReply: "Ecco, nessuno mi crede... quando i piccioni invaderanno tutto non dire che non ti avevo avvisato!"
    endConversationAfterChoice: false
  interactionOptions:
  - Rassicurarlo
  - Prenderlo in giro
  - Spaventarlo per ottenere un oggetto
  traits:
  - Informazioni
  - Scorciatoia
  - Rischio incontro nemici
