name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

  package-clickable:
    name: Package clickable app (${{ matrix.label }})
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            label: linux
            icon: lwjgl3/icons/logo.png
          - runner: windows-latest
            label: windows
            icon: lwjgl3/icons/logo.ico
          - runner: macos-latest
            label: macos
            icon: lwjgl3/icons/logo.icns

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        shell: bash
        run: chmod +x gradlew

      - name: Build desktop JAR
        shell: bash
        run: ./gradlew lwjgl3:jar

      - name: Build clickable app with jpackage
        shell: bash
        run: |
          set -euo pipefail

          version="$(grep '^projectVersion=' gradle.properties | cut -d= -f2)"
          jar_path="$(find lwjgl3/build/libs -maxdepth 1 -name '*.jar' -print -quit)"
          jar_name="$(basename "$jar_path")"

          rm -rf jpackage-output
          mkdir -p jpackage-output

          args=(
            --type app-image
            --name "Viddani VS Alieni"
            --input lwjgl3/build/libs
            --main-jar "$jar_name"
            --main-class io.github.iss_2025_2026.lwjgl3.Lwjgl3Launcher
            --dest jpackage-output
            --app-version "$version"
            --vendor "ISS 2025-2026"
            --java-options "--enable-native-access=ALL-UNNAMED"
          )

          if [[ "${{ runner.os }}" == "macOS" ]]; then
            args+=(--java-options "-XstartOnFirstThread")
            args+=(--mac-package-identifier "io.github.iss20252026.viddanivsalieni")
          fi

          if [[ -f "${{ matrix.icon }}" ]]; then
            args+=(--icon "${{ matrix.icon }}")
          fi

          jpackage "${args[@]}"

      - name: Upload clickable app artifact
        uses: actions/upload-artifact@v4
        with:
          name: viddani-vs-alieni-${{ github.ref_name }}-${{ matrix.label }}-clickable
          path: jpackage-output/**
          if-no-files-found: error
          retention-days: 14
