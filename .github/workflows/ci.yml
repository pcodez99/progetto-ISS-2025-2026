name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    name: Test and package desktop build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run tests and build desktop artifacts
        run: ./gradlew test lwjgl3:jar lwjgl3:distZip

      - name: Collect downloadable artifacts
        run: |
          mkdir -p ci-artifacts
          cp lwjgl3/build/libs/*.jar ci-artifacts/
          cp lwjgl3/build/distributions/*.zip ci-artifacts/

      - name: Upload branch artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: iss-2025-desktop-${{ github.ref_name }}-${{ github.run_number }}-${{ github.sha }}
          path: ci-artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload pull request artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: iss-2025-desktop-pr-${{ github.event.pull_request.number }}-${{ github.run_number }}-${{ github.sha }}
          path: ci-artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload manual run artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: iss-2025-desktop-manual-${{ github.run_number }}-${{ github.sha }}
          path: ci-artifacts/*
          if-no-files-found: error
          retention-days: 14
