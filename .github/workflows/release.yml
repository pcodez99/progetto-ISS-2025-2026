name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

  package-clickable:
    name: Package clickable app (${{ matrix.label }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            label: linux
            icon: lwjgl3/icons/logo.png
          - runner: windows-latest
            label: windows
            icon: lwjgl3/icons/logo.ico
          - runner: macos-latest
            label: macos
            icon: lwjgl3/icons/logo.icns

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        shell: bash
        run: chmod +x gradlew

      - name: Build desktop JAR
        shell: bash
        run: ./gradlew lwjgl3:jar

      - name: Build clickable app with jpackage
        shell: bash
        run: |
          set -euo pipefail

          raw_version="${GITHUB_REF_NAME#v}"
          app_version="$(printf '%s' "$raw_version" | sed -E 's/[^0-9.].*$//')"
          if [[ -z "$app_version" ]]; then
            app_version="1.0.0"
          fi

          jar_path="$(find lwjgl3/build/libs -maxdepth 1 -name '*.jar' -print -quit)"
          jar_name="$(basename "$jar_path")"

          rm -rf jpackage-output
          mkdir -p jpackage-output

          args=(
            --type app-image
            --name "Viddani VS Alieni"
            --input lwjgl3/build/libs
            --main-jar "$jar_name"
            --main-class io.github.iss_2025_2026.lwjgl3.Lwjgl3Launcher
            --dest jpackage-output
            --app-version "$app_version"
            --vendor "ISS 2025-2026"
            --java-options "--enable-native-access=ALL-UNNAMED"
          )

          if [[ "${{ runner.os }}" == "macOS" ]]; then
            args+=(--java-options "-XstartOnFirstThread")
            args+=(--mac-package-identifier "io.github.iss20252026.viddanivsalieni")
          fi

          if [[ -f "${{ matrix.icon }}" ]]; then
            args+=(--icon "${{ matrix.icon }}")
          fi

          jpackage "${args[@]}"

      - name: Upload packaged app
        uses: actions/upload-artifact@v4
        with:
          name: viddani-vs-alieni-${{ github.ref_name }}-${{ matrix.label }}-clickable
          path: jpackage-output/**
          if-no-files-found: error

  github-release:
    name: Publish GitHub release
    needs: package-clickable
    runs-on: ubuntu-latest

    steps:
      - name: Download packaged apps
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Prepare release files
        run: |
          set -euo pipefail
          mkdir -p release-assets

          for artifact_dir in downloaded-artifacts/*; do
            artifact_name="$(basename "$artifact_dir")"
            (
              cd "$artifact_dir"
              zip -r "../../release-assets/${artifact_name}.zip" .
            )
          done

          (
            cd release-assets
            sha256sum *.zip > SHA256SUMS.txt
          )

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Download the package for your operating system, extract it, then launch the app:

            - Windows: open `Viddani VS Alieni/Viddani VS Alieni.exe`
            - macOS: open `Viddani VS Alieni.app`
            - Linux: run `Viddani VS Alieni/bin/Viddani VS Alieni`
