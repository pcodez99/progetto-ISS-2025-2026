name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  github-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run tests and build release artifacts
        run: ./gradlew test lwjgl3:jar lwjgl3:distZip

      - name: Prepare release files
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p release-assets

          jar_file="$(find lwjgl3/build/libs -maxdepth 1 -name '*.jar' -print -quit)"
          zip_file="$(find lwjgl3/build/distributions -maxdepth 1 -name '*.zip' -print -quit)"

          test -n "$jar_file"
          test -n "$zip_file"

          cp "$jar_file" "release-assets/viddani-vs-alieni-${version}-desktop.jar"
          cp "$zip_file" "release-assets/viddani-vs-alieni-${version}-desktop.zip"

          (
            cd release-assets
            shasum -a 256 * > SHA256SUMS.txt
          )

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Download `viddani-vs-alieni-${{ github.ref_name }}-desktop.zip`, extract it, then run:

            - Linux/macOS: `bin/ISS 2025`
            - Windows: `bin/ISS 2025.bat`

            The `.jar` asset is also available for users who prefer running the game with an installed JDK.
