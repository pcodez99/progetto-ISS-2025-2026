buildscript {
  repositories {
    mavenCentral()
    gradlePluginPortal()
    mavenLocal()
    google()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
  }
  dependencies {


  }
}

allprojects {
  apply plugin: 'eclipse'
  apply plugin: 'idea'

  // This allows you to "Build and run using IntelliJ IDEA", an option in IDEA's Settings.
  idea {
    module {
      outputDir = file('build/classes/java/main')
      testOutputDir = file('build/classes/java/test')
    }
  }
}

configure(subprojects) {
  apply plugin: 'java-library'
  java.sourceCompatibility = 8

  // From https://lyze.dev/2021/04/29/libGDX-Internal-Assets-List/
  // The article can be helpful when using assets.txt in your project.
  tasks.register('generateAssetList') {
    inputs.dir("${project.rootDir}/assets/")
    // projectFolder/assets
    File assetsFolder = new File("${project.rootDir}/assets/")
    // projectFolder/assets/assets.txt
    File assetsFile = new File(assetsFolder, "assets.txt")
    // delete that file in case we've already created it
    assetsFile.delete()

    // iterate through all files inside that folder
    // convert it to a relative path
    // and append it to the file assets.txt
    fileTree(assetsFolder).collect { assetsFolder.relativePath(it) }.sort().each {
      assetsFile.append(it + "\n")
    }
  }
  processResources.dependsOn 'generateAssetList'

  compileJava {
    options.incremental = true
  }
}

subprojects {
  version = "$projectVersion"
  ext.appName = 'ISS 2025'
  repositories {
    mavenCentral()
    // You may want to remove the following line if you have errors downloading dependencies.
    mavenLocal()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
    maven { url = 'https://jitpack.io' }
  }
}

eclipse.project.name = 'ISS 2025' + '-parent'

project(":core"){
  test{
    useJUnitPlatform()
  }
}

tasks.register('compilePuml', JavaExec) {
    def plantumlJar = file(".gradle/plantuml/plantuml.jar")
    classpath = files(plantumlJar)
    mainClass = "net.sourceforge.plantuml.Run"

    doFirst {
        def pumlDir = file("docs/diagrams")
        if (!pumlDir.exists()) {
            println "Creazione della cartella docs/diagrams..."
            pumlDir.mkdirs()
        }

        if (!plantumlJar.exists()) {
            println "Download di PlantUML in corso..."
            plantumlJar.parentFile.mkdirs()
            new URL("https://github.com/plantuml/plantuml/releases/download/v1.2024.3/plantuml-1.2024.3.jar").withInputStream { i ->
                plantumlJar.withOutputStream { it << i }
            }
        }

        def pumlFiles = fileTree(dir: 'docs/diagrams', include: '**/*.puml')
        if (pumlFiles.isEmpty()) {
            println "Nessun file .puml trovato in docs/diagrams."
            throw new org.gradle.api.tasks.StopExecutionException("Nessun diagramma PlantUML da compilare.")
        }

        def dotPath = ["sh", "-c", "command -v dot || true"].execute().text.trim()
        if (!dotPath) {
            dotPath = ["/opt/homebrew/bin/dot", "/usr/local/bin/dot", "/opt/local/bin/dot"]
                    .find { file(it).exists() }
        }
        if (!dotPath) {
            println "Graphviz non trovato: salto la compilazione dei diagrammi PlantUML."
            println "Installa Graphviz per rigenerarli, ad esempio: brew install graphviz"
            throw new org.gradle.api.tasks.StopExecutionException("Graphviz non disponibile.")
        }

        println "Compilazione dei diagrammi PlantUML in formato SVG..."
        environment "GRAPHVIZ_DOT", dotPath
        args = ["-tsvg"] + pumlFiles.collect { it.absolutePath }
    }
}
